function pcsv(t){t=t.replace(/^\ufeff/,'');const d=t.includes('\t')?'\t':t.includes(';')?';':t.includes(',')?',':'\u0001',o=[];let r=[],c='',q=0;for(let i=0;i<t.length;i++){const h=t[i];if(q){if(h=='"'){if(t[i+1]=='"'){c+='"';i++}else q=0}else c+=h}else if(h=='"')q=1;else if(h==d){r.push(c);c=''}else if(h=='\n'||h=='\r'){if(h=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';o.push(r);r=[]}else c+=h}r.push(c);o.push(r);return o.map(x=>x.map(v=>v.trim())).filter(x=>x.some(Boolean))}

function rekapTunggakan(){
 const ks=[...new Set(D.siswa.map(s=>s.k||''))].sort((a,b)=>!a?1:!b?-1:a.localeCompare(b,'id',{numeric:true}));let g=0,out=[];

 const txt=out.length?`Daftar tunggakan ${D.nama}\n${dm(today())}\n\n`+out.join('\n\n')+`\n\nTotal tunggakan: ${rp(g)}`:'Semua siswa sudah lunas 🎉';

async function cetakF4(bid){
 if(!D.siswa.length)return info('Belum ada siswa untuk dicetak.');
 const cs=getComputedStyle(document.documentElement),OK=cs.getPropertyValue('--c-ok').trim()||'#3ddc97',NO=cs.getPropertyValue('--c-red').trim()||'#ff6b6b';
 const bx=D.box.find(x=>x.id==bid)||{n:''},T=D.tag.filter(t=>t.b==bid);if(!T.length)return info('Kotak ini belum punya tagihan untuk dicetak.');
 const jd=/ikhtit|ikhtia|tahtim/i.test(bx.n)?'IKHTITAM':String(bx.n).toUpperCase();
 const nomS=s=>T.reduce((a,t)=>a+(ps(t).includes(s)?t.nom:0),0),paidS=s=>T.reduce((a,t)=>a+(ps(t).includes(s)?pd(s.id,t.id):0),0);
 const col=(p,n)=>(n?p>=n:p>0)?OK:NO,fN=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
 const cv=document.createElement('canvas').getContext('2d'),mm=3.7795,FF='"Times New Roman",Times,"Liberation Serif",serif';
 const legH=`<table class="c-lg2" style="left:118.4mm;top:LEGTOPmm">`+[[NO,'BELUM LUNAS'],[OK,'LUNAS']].map(x=>`<tr><td class="c-sw" style="background:${x[0]}"></td><td class="c-lb">${x[1]}</td></tr>`).join('')+'</table>';
 const SW=D.siswa.filter(s=>T.some(t=>ps(t).includes(s)));
 const ks=[...new Set(SW.map(s=>s.k||''))].sort((a,b)=>!a?1:!b?-1:a.localeCompare(b,'id',{numeric:true}));
 const amt=p=>`<div class="c-m"><span>Rp</span><span>${fN(p)},00</span></div>`;
 const sheet=k=>{
  const L=SW.filter(s=>(s.k||'')==k).sort((a,b)=>a.n.localeCompare(b.n,'id',{sensitivity:'base'}));
  const rows=L.map((s,i)=>({no:i+1,n:s.n,a:s.a||'',p:paidS(s),c:col(paidS(s),nomS(s))})),sum=rows.reduce((a,r)=>a+r.p,0),n=rows.length;
  const AVH=214,seq=[...rows,{t:1}];let nL=Math.min(50,n);if(n+1-nL>42)nL=n+1-42;
  const parts=[seq.slice(0,nL),seq.slice(nL)];
  const G=[{x:8.8,w:95,fs:8.5,rh:Math.min(4.2,AVH/(nL+1)),cw:[5.1,43.8,14.5,31.6],hd:1},{x:104.8,w:97.5,fs:10.5,rh:Math.min(5.09,AVH/Math.max(1,parts[1].length)),cw:[7.8,42.9,15.2,31.6],hd:0}];
  let body='',rightEnd=76;
  parts.forEach((part,ci)=>{if(!part.length)return;const g=G[ci];cv.font=g.fs+'pt '+FF;const nW=(g.cw[1]-1.9)*mm;
   body+=`<table style="--rh:${g.rh}mm;--fs:${g.fs}pt;left:${g.x}mm;top:76mm;width:${g.w}mm"><colgroup>${g.cw.map(w=>`<col style="width:${w}mm">`).join('')}</colgroup>`+(g.hd?'<tr><th>No</th><th>Nama</th><th>Asrama</th><th>Total Tabungan</th></tr>':'')
   +part.map(r=>{if(r.t)return`<tr class="c-tot"><td></td><td colspan="2" class="c-n">TOTAL</td><td>${amt(sum)}</td></tr>`;
    const w=cv.measureText(r.n).width,sc=w>nW?(nW/w*.98).toFixed(3):1;
    return`<tr><td class="c-n">${r.no}</td><td class="c-nm"><span style="transform:scaleX(${sc})">${esc(r.n)}</span></td><td>${esc(r.a)}</td><td style="background:${r.c}">${r.p?amt(r.p):''}</td></tr>`}).join('')+'</table>';
   if(ci==1)rightEnd=76+part.length*g.rh});
  const kl=String(k||'TANPA KELAS').replace(/^kelas\s*/i,'').toUpperCase();
  return`<div class="c-sh"><img class="c-cop" src="${COP_H}"><div class="c-tt">REKAPAN PEMBAYARAN ${esc(jd)}<br>${k?'KELAS ':''}${esc(kl)}</div>${body}${legH.replace('LEGTOP',(rightEnd+4).toFixed(1))}<img class="c-cft" src="${COP_F}"></div>`};
 const p=$('#c-pr');p.className='c-f4';p.innerHTML=ks.map(sheet).join('');
 let st=$('#c-pgf4');if(!st){st=document.createElement('style');st.id='c-pgf4';document.head.appendChild(st)}st.textContent='@page{size:215mm 330mm;margin:0}';
 await Promise.all([...p.querySelectorAll('img')].map(im=>im.decode?im.decode().catch(()=>{}):0));
 print()}
